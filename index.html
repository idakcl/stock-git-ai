<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 内部经营工具，不对外开放检索；分享链接也带随机 token，不应被收录 -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="进销存管理系统：采购、销售、库存、订单与资金往来一体化记账。" />
    <!-- 手机浏览器地址栏/状态栏配色与页面主色一致（安卓 Chrome / iOS Safari） -->
    <meta name="theme-color" content="#409eff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="进销存" />
    <!-- 金额、单号里的数字不要被识别成电话号码加下划线 -->
    <meta name="format-detection" content="telephone=no" />
    <title>进销存管理</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
